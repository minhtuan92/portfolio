# Builds the Angular app and deploys it to GitHub Pages.
# (The file name is a leftover from the Jekyll starter workflow; the pipeline is Angular + pnpm.)
name: Deploy portfolio to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      # Angular 22 needs Node ^22.22.3 or ^24.15.0.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The application builder writes the site to dist/<project>/browser.
      # 404.html is a copy of index.html so deep links (e.g. /portfolio/projects) load the SPA.
      - name: Build
        run: pnpm run build:gh-page && cp ./dist/myPortfolio/browser/index.html ./dist/myPortfolio/browser/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/myPortfolio/browser

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
